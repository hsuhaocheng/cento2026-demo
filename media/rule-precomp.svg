<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="-apple-system,Segoe UI,Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif"><rect width="760" height="270" rx="12" fill="#FAF9F6"/><text x="24" y="38" font-size="18" fill="#2B2B2E" text-anchor="start" font-weight="700">多張圖做成一個預合成 ＝ 一卡</text><text x="24" y="62" font-size="13" fill="#7A7A80" text-anchor="start" font-weight="400">一卡裡要換好幾張圖（例如一個動作的分解）時，把它們放進預合成，主合成裡就只有一個圖層、只算一卡。</text><rect x="24" y="84" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#D6D4CE" stroke-width="1.5"/><text x="38" y="106" font-size="13" fill="#2B2B2E" text-anchor="start" font-weight="700">預合成「鏡頭 2」</text><rect x="38" y="120" width="90" height="24" rx="4" fill="#DCE8F7" stroke="#9DB3D6" stroke-width="1.5"/><text x="46" y="137" font-size="12" fill="#2B2B2E" text-anchor="start" font-weight="400">c02_a.jpg</text><rect x="128" y="152" width="90" height="24" rx="4" fill="#DCE8F7" stroke="#9DB3D6" stroke-width="1.5"/><text x="136" y="169" font-size="12" fill="#2B2B2E" text-anchor="start" font-weight="400">c02_b.jpg</text><rect x="218" y="184" width="90" height="24" rx="4" fill="#DCE8F7" stroke="#9DB3D6" stroke-width="1.5"/><text x="226" y="201" font-size="12" fill="#2B2B2E" text-anchor="start" font-weight="400">c02_c.jpg</text><path d="M340 160 L400 160" stroke="#2B2B2E" stroke-width="2"/><path d="M400 160 l-9 -6 v12 z" fill="#2B2B2E"/><rect x="416" y="84" width="320" height="150" rx="8" fill="#FFFFFF" stroke="#D6D4CE" stroke-width="1.5"/><text x="430" y="106" font-size="13" fill="#2B2B2E" text-anchor="start" font-weight="700">主合成</text><rect x="430" y="120" width="80" height="24" rx="4" fill="#DCE8F7" stroke="#9DB3D6" stroke-width="1.5"/><text x="438" y="137" font-size="12" fill="#2B2B2E" text-anchor="start" font-weight="400">鏡頭 1</text><rect x="510" y="120" width="130" height="24" rx="4" fill="#F3E6C8" stroke="#C9A227" stroke-width="1.5"/><text x="518" y="137" font-size="12" fill="#2B2B2E" text-anchor="start" font-weight="400">鏡頭 2（預合成）</text><rect x="640" y="120" width="82" height="24" rx="4" fill="#DCE8F7" stroke="#9DB3D6" stroke-width="1.5"/><text x="648" y="137" font-size="12" fill="#2B2B2E" text-anchor="start" font-weight="400">鏡頭 3</text><rect x="432" y="170" width="76" height="28" rx="4" fill="#EAF0FA" stroke="#4A7BD0" stroke-width="1.5"/><text x="470.0" y="189" font-size="13" fill="#4A7BD0" text-anchor="middle" font-weight="700">卡 001</text><rect x="512" y="170" width="126" height="28" rx="4" fill="#EAF0FA" stroke="#4A7BD0" stroke-width="1.5"/><text x="575.0" y="189" font-size="13" fill="#4A7BD0" text-anchor="middle" font-weight="700">卡 002</text><rect x="642" y="170" width="78" height="28" rx="4" fill="#EAF0FA" stroke="#4A7BD0" stroke-width="1.5"/><text x="681.0" y="189" font-size="13" fill="#4A7BD0" text-anchor="middle" font-weight="700">卡 003</text><text x="430" y="222" font-size="12" fill="#7A7A80" text-anchor="start" font-weight="400">如果三張圖直接放在主合成，會變成三卡。</text></svg>